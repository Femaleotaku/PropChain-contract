[package]
name = "propchain-tests"
version = "1.0.0"
authors = ["PropChain Team <dev@propchain.io>"]
edition = "2021"
publish = false

[lib]
name = "propchain_tests"
path = "lib.rs"

[dependencies]
# ink! dependencies
ink = { version = "5.0.0", default-features = false }
scale = { package = "parity-scale-codec", version = "3.6.9", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }

# Testing dependencies
ink_e2e = { version = "5.0.0", optional = true }
ink_env = { version = "5.0.0", default-features = false }

# Contract dependencies
propchain-traits = { path = "../contracts/traits", default-features = false }
propchain-contracts = { path = "../contracts/lib", default-features = false }
propchain-monitoring = { path = "../contracts/monitoring", default-features = false, features = ["ink-as-dependency"] }
compliance_registry = { path = "../contracts/compliance_registry", default-features = false }

# Issue #488 / #487 / #489: contract crates needed for new test modules
fractional = { path = "../contracts/fractional", default-features = false }
governance = { path = "../contracts/governance", default-features = false }
staking = { path = "../contracts/staking", default-features = false }
propchain-bridge = { path = "../contracts/bridge", default-features = false }
oracle = { path = "../contracts/oracle", default-features = false }
propchain-insurance = { path = "../contracts/insurance", default-features = false }

# Issue #922 / #923 / #924 / #925: contracts under integration test
propchain-fees = { path = "../contracts/fees", default-features = false }
propchain-analytics = { path = "../contracts/analytics", default-features = false }
propchain-database = { path = "../contracts/database", default-features = false }
propchain-identity = { path = "../contracts/identity", default-features = false }

# Async runtime
tokio = { version = "1.0", features = ["full"], optional = true }

# Utilities
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
rand = "0.8"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
propchain-contracts = { path = "../contracts/lib", default-features = false }
propchain-monitoring = { path = "../contracts/monitoring", default-features = false, features = ["ink-as-dependency"] }
compliance_registry = { path = "../contracts/compliance_registry", default-features = false }
proptest = { version = "1.4", features = ["std"] }

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "propchain-contracts/std",
    "propchain-monitoring/std",
    "compliance_registry/std",
    "fractional/std",
    "governance/std",
    "staking/std",
    "propchain-bridge/std",
    "propchain-insurance/std",
    "propchain-fees/std",
    "propchain-analytics/std",
    "propchain-database/std",
    "propchain-identity/std",
    "serde/std",
    "serde_json/std",
    "tokio",
]
e2e-tests = ["std", "ink_e2e"]
security-tests = ["std"]
disabled_test = []




# Issues #922-#925: explicit integration-test targets (the package root is
# the tests/ directory itself, so cargo cannot auto-discover test files)
[[test]]
name = "integration_database"
path = "integration_database.rs"

[[test]]
name = "integration_fees"
path = "integration_fees.rs"

[[test]]
name = "integration_analytics"
path = "integration_analytics.rs"

[[test]]
name = "integration_identity"
path = "integration_identity.rs"
